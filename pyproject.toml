[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-rag"
version = "0.1.0"
description = "Vietnamese Retrieval-Augmented Generation Framework"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Vi-RAG Team", email = "virag@example.com"}
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "vietnamese-nlp",
    "document-processing",
    "vector-search",
    "gemini",
    "qdrant"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    # Core dependencies
    "numpy>=1.21.0,<3.0.0",
    "python-dotenv>=0.19.0",
    
    # Document processing
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "underthesea>=6.0.0",
    
    # Vector store
    "qdrant-client>=1.7.0",
    
    # AI models
    "google-generativeai>=0.1.0",
    "google-genai>=0.1.0",
    
    # Optional text processing
    "sentence-transformers>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

evaluation = [
    "ragas>=0.4.0",
    "datasets>=4.0.0",
]

all = [
    "vi-rag[dev,evaluation]",
]

[project.urls]
Homepage = "https://github.com/NOT-erorr/PBL_2025_Vi-RAG_framework"
Repository = "https://github.com/NOT-erorr/PBL_2025_Vi-RAG_framework"
Documentation = "https://github.com/NOT-erorr/PBL_2025_Vi-RAG_framework/blob/main/README.md"
"Bug Tracker" = "https://github.com/NOT-erorr/PBL_2025_Vi-RAG_framework/issues"

[tool.setuptools]
packages = ["Vi-RAG"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"Vi-RAG" = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=Vi-RAG --cov-report=term-missing"
testpaths = [
    "test",
    "tests",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
